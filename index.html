      // Fix environment where window.fetch is defined with only a getter (e.g. iframe proxy)
      (function() {
        try {
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (prop === 'fetch' && descriptor && typeof descriptor.get === 'function' && typeof descriptor.set !== 'function') {
              var currentFetch;

                configurable: true,
                enumerable: descriptor.enumerable !== undefined ? descriptor.enumerable : true,
                get: function() {

                },
                set: function(val) {
                  currentFetch = val;
                }
              });
            }
            return originalDefineProperty.apply(this, arguments);
          };

          // Also check if window.fetch already exists with only a getter and can be reconfigured
          var currentDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (currentDesc && currentDesc.configurable && typeof currentDesc.get === 'function' && typeof currentDesc.set !== 'function') {
            var getterFetch = currentDesc.get;
            var assignedFetch;
            originalDefineProperty(window, 'fetch', {
              configurable: true,
              enumerable: currentDesc.enumerable !== undefined ? currentDesc.enumerable : true,
              get: function() {
                return assignedFetch !== undefined ? assignedFetch : getterFetch();
              },
              set: function(val) {

              }
            });
          }
        } catch (e) {
          console.warn('Fetch polyfill patch error:', e);
        }
      })();
